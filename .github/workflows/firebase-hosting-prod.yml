name: Deploy to Firebase Hosting (PROD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Scopes vars.WORKSHOP_API_URL below to this GitHub Environment's own Variables (Settings ->
    # Environments -> production) — see poc-apps-script's README.md "Environment config" section
    # for the same pattern used on the backend.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Firebase Hosting serves from the site root, so no --base-href override.
      - name: Build (production)
        env:
          WORKSHOP_API_URL: ${{ vars.WORKSHOP_API_URL }}
        run: node scripts/inject-api-url.js prod npx ng build --configuration production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poc-web-app-7e636
          channelId: live
