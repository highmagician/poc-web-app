name: Deploy to Firebase Hosting (PROD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Scopes vars.WORKSHOP_API_URL below to this GitHub Environment's own Variables (Settings ->
    # Environments -> production) — see poc-apps-script's README.md "Environment config" section
    # for the same pattern used on the backend.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Firebase Hosting serves from the site root, so no --base-href override.
      # The FIREBASE_* vars are optional (see scripts/inject-api-url.js) — they point at the
      # PROD Firebase project for the firebase-page demo's Auth testing, kept separate from
      # DEV's own project (see firebase-hosting-dev.yml) so test sign-ins never land in the
      # same Auth user pool as production.
      - name: Build (production)
        env:
          WORKSHOP_API_URL: ${{ vars.WORKSHOP_API_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: node scripts/inject-api-url.js prod npx ng build --configuration production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poc-web-app-7e636
          channelId: live
