name: Deploy to Firebase Hosting (DEV)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Scopes vars.WORKSHOP_API_URL below to this GitHub Environment's own Variables (Settings ->
    # Environments -> development) — see poc-apps-script's README.md "Environment config" section
    # for the same pattern used on the backend.
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Firebase Hosting serves from the site root, so no --base-href override.
      # devPreview is an optimized build (unlike the local-only "development" config) that still
      # targets the DEV Apps Script backend — see src/environments/environment.dev.ts.
      - name: Build (devPreview)
        env:
          WORKSHOP_API_URL: ${{ vars.WORKSHOP_API_URL }}
        run: node scripts/inject-api-url.js dev npx ng build --configuration devPreview

      # Deploys to the "dev" preview channel of the same site (not the live prod channel),
      # so it gets its own URL and never overwrites production.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poc-web-app-7e636
          channelId: dev
          expires: 30d
