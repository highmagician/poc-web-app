name: Deploy to Firebase Hosting (DEV)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Scopes vars.WORKSHOP_API_URL below to this GitHub Environment's own Variables (Settings ->
    # Environments -> development) — see poc-apps-script's README.md "Environment config" section
    # for the same pattern used on the backend.
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Firebase Hosting serves from the site root, so no --base-href override.
      # devPreview is an optimized build (unlike the local-only "development" config) that still
      # targets the DEV Apps Script backend — see src/environments/environment.dev.ts.
      # The FIREBASE_* vars are optional (see scripts/inject-api-url.js) — they point at a
      # separate DEV Firebase project for the firebase-page demo's Auth testing, so test sign-ins
      # never land in the same Auth user pool as production (see firebase-hosting-prod.yml).
      - name: Build (devPreview)
        env:
          WORKSHOP_API_URL: ${{ vars.WORKSHOP_API_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: node scripts/inject-api-url.js dev npx ng build --configuration devPreview

      # Deploys to the live channel of the separate poc-web-app---dev Firebase project (not
      # poc-web-app-7e636), so DEV Hosting is fully isolated from PROD — not just by channel.
      # firebaseServiceAccount resolves to this job's own value because this job declares
      # `environment: development` above — Settings -> Environments -> development must have
      # its own Secret named FIREBASE_SERVICE_ACCOUNT (the poc-web-app---dev project's service
      # account key), distinct from whatever value the `production` Environment holds for the
      # same secret name (see firebase-hosting-prod.yml). No separate secret name needed.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poc-web-app---dev
          channelId: live
