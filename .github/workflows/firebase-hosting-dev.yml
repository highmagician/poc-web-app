name: Deploy to Firebase Hosting (DEV)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Firebase Hosting serves from the site root, so no --base-href override.
      # devPreview is an optimized build (unlike the local-only "development" config) that still
      # targets the DEV Apps Script backend — see src/environments/.
      - run: npx ng build --configuration devPreview

      # Deploys to the "dev" preview channel of the same site (not the live prod channel),
      # so it gets its own URL and never overwrites production.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poc-web-app-7e636
          channelId: dev
          expires: 30d
