<header>
  <h1>POC web app</h1>
</header>

<main>
  <label>
    Name
    <input type="text" [ngModel]="name()" (ngModelChange)="onNameChange($event)" />
  </label>

  <label>
    Number
    <input type="number" [ngModel]="numberValue()" (ngModelChange)="onNumberChange($event)" />
  </label>

  <label>
    Output
    <input type="text" [value]="output()" readonly />
  </label>

  <p><a routerLink="/bakery/workshop">Visit the Homie Bakery workshop page →</a></p>
</main>
