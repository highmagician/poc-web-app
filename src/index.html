<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PocWebApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <script>
    // Counterpart to the redirect in public/404.html: decode the "?/" encoded
    // path back into a real URL via history.replaceState before Angular's router boots.
    (function () {
      var search = window.location.search;
      if (search[1] === '/') {
        var decoded = search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, '', window.location.pathname.slice(0, -1) + decoded + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
